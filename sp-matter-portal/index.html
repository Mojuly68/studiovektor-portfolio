<!doctype html><html><head><meta name="robots" content="noindex"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SP Matter Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: case-file portal — dossier record (stages, metrics) left, deliverables + investigator right; drawer for stage detail, modal for matter/document forms.
   Stallard Panebianco design system, Midnight theme (dark-first; the system defines no light values, so the page commits to Midnight). */
:root{
  color-scheme:dark;
  --bg-primary:#091E3A; --bg-secondary:#0B2343; --bg-card:#0D2647; --bg-card-hover:#112D53; --bg-subtle:#123058;
  --navy-600-glow:rgba(24,50,87,.4); --grid-line:rgba(255,255,255,.05);
  --text-primary:#EDE7DB; --text-secondary:#B3BCCC; --text-muted:#7C879B; --text-inverse:#0A111E;
  --border-subtle:#1F3A62; --border-accent:#6E5C38;
  --accent-gold:#C8A35B; --accent-gold-soft:#DBBF86; --accent-blue:#78A9DC; --accent-indigo:#8E95E6;
  --badge-privileged-bg:#251F13; --badge-privileged-fg:#DBBF86; --badge-privileged-border:#6E5C38;
  --danger:#E39A8F; --danger-border:#7A3E37;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -18px rgba(0,0,0,.65);
  --font-display:"Newsreader", Georgia, "Times New Roman", serif;
  --font-sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
}
*{box-sizing:border-box}
html,body{background:var(--bg-primary)}
body{color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:var(--s4)}
@media(min-width:768px){body{padding-inline:var(--s6)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-gold);outline-offset:2px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:var(--s4);top:var(--s4);background:var(--bg-card);padding:var(--s2) var(--s4);z-index:99}
.wrap{max-width:1280px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-gold-soft)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--text-secondary)}
.fine{font-size:12.5px;color:var(--text-muted);margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-weight:600}
.brand span{font-weight:400;color:var(--text-secondary);font-size:14px}
.brand{align-items:center}
.brand .logo{width:30px;height:30px;flex:none;display:block}
.clip img{width:26px;height:26px;display:block}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);border:1px solid var(--border-subtle);background:transparent;padding:9px 14px;font-weight:500;font-size:14px;transition:border-color .15s,background .15s,transform .15s,color .15s;color:var(--text-primary);text-decoration:none;border-radius:0;white-space:nowrap}
.btn:hover:not([disabled]){border-color:var(--border-accent);transform:translateY(-1px)}
.btn-gold{background:var(--accent-gold);border-color:var(--accent-gold);color:var(--text-inverse);font-weight:600}
.btn-gold:hover:not([disabled]){background:var(--accent-gold-soft);border-color:var(--accent-gold-soft)}
.btn-edit{border-color:var(--accent-indigo)}
.btn-danger{border-color:var(--danger-border);color:var(--danger)}
.btn-text{border-color:transparent;padding:6px 8px;color:var(--text-secondary)}
.btn-text:hover:not([disabled]){color:var(--text-primary);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn-sm{padding:6px 10px;font-size:13px}

.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border-subtle);color:var(--text-secondary);white-space:nowrap}
.badge svg{width:13px;height:13px}
.badge-priv{background:var(--badge-privileged-bg);color:var(--badge-privileged-fg);border-color:var(--badge-privileged-border)}
.role-pill{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border-subtle);color:var(--text-secondary);white-space:nowrap}
.role-pill.admin{border-color:var(--accent-indigo);color:var(--accent-indigo)}

/* Shell */
/* Page backdrop — mirrors the homepage hero: navy ground, hairline grid fading from top-left, soft glow top-right, faint fingerprint mark bottom-left */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.backdrop .grid-lines{position:absolute;inset:0;background-image:linear-gradient(90deg,var(--grid-line) 1px,transparent 0),linear-gradient(var(--grid-line) 1px,transparent 0);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at top left,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at top left,#000 30%,transparent 75%)}
.backdrop .glow{position:absolute;right:-160px;top:-160px;width:520px;height:520px;border-radius:50%;background:var(--navy-600-glow);filter:blur(64px)}
.backdrop .mark{position:absolute;left:-128px;bottom:-160px;width:560px;max-width:none;height:auto;opacity:.03}
/* Site header — mirrors the Stallard Panebianco homepage header (transparent over navy, white once scrolled) */
.site-header{--hd-navy-900:#091E3A;--hd-navy-500:#2A4670;--hd-navy-50:#EEF2F8;--hd-brass-400:#D2AB37;--hd-brass-500:#C59B27;--hd-brass-600:#A07C1C;--hd-slate-200:#E2E8F0;--hd-white:#FFFFFF;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:calc(-1 * var(--s4));padding-inline:var(--s4);border-bottom:1px solid transparent;background:transparent;transition:background-color .3s,box-shadow .3s,border-color .3s}
@media(min-width:768px){.site-header{margin-inline:calc(-1 * var(--s6));padding-inline:var(--s6)}}
.site-header.scrolled,.site-header.menu-open{background:rgba(255,255,255,.95);border-bottom-color:var(--hd-slate-200);box-shadow:0 1px 2px rgba(0,0,0,.05);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hd-in{max-width:1240px;margin:0 auto;height:72px;display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.hd-brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.hd-brand img{width:44px;height:44px;flex:none;display:block}
.hd-brand .on-light{display:none}
.scrolled .hd-brand .on-dark,.menu-open .hd-brand .on-dark{display:none}
.scrolled .hd-brand .on-light,.menu-open .hd-brand .on-light{display:block}
.hd-name{display:block;font-family:var(--font-display);font-size:17px;font-weight:500;letter-spacing:-.025em;line-height:1;color:var(--hd-white)}
.hd-tag{display:block;margin-top:4px;font-family:var(--font-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1;color:var(--hd-brass-400)}
.scrolled .hd-name,.menu-open .hd-name{color:var(--hd-navy-900)}
.scrolled .hd-tag,.menu-open .hd-tag{color:var(--hd-brass-600)}
.hd-nav{display:none;align-items:center;gap:32px}
@media(min-width:1024px){.hd-nav{display:flex}}
.hd-link{position:relative;font-size:14px;font-weight:500;color:var(--hd-navy-50);text-decoration:none;transition:color .15s}
.hd-link::after{content:"";position:absolute;left:0;bottom:-6px;height:1px;width:0;background:var(--hd-brass-500);transition:width .2s}
.hd-link:hover{color:var(--hd-white)}
.hd-link:hover::after{width:100%}
.scrolled .hd-link{color:var(--hd-navy-500)}
.scrolled .hd-link:hover{color:var(--hd-navy-900)}
.hd-cta{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;padding:10px 20px;font-size:14px;font-weight:600;line-height:20px;background:var(--hd-brass-500);color:var(--hd-navy-900);text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background-color .15s;white-space:nowrap}
.hd-cta:hover{background:var(--hd-brass-400)}
.hd-burger{display:grid;place-items:center;width:40px;height:40px;margin-right:-8px;border:0;background:transparent;color:var(--hd-white);border-radius:6px;flex:none}
.hd-burger svg{width:24px;height:24px}
.scrolled .hd-burger,.menu-open .hd-burger{color:var(--hd-navy-900)}
@media(min-width:1024px){.hd-burger{display:none}}
.hd-mobile{position:fixed;left:0;right:0;bottom:0;top:calc(72px + env(safe-area-inset-top,0px));overflow-y:auto;background:var(--hd-white);padding:16px 20px calc(40px + env(safe-area-inset-bottom,0px));z-index:29}
@media(min-width:1024px){.hd-mobile{display:none!important}}
.hd-mobile ul{list-style:none;margin:0 auto;padding:0;max-width:1240px}
.hd-mobile li + li{border-top:1px solid var(--hd-slate-200)}
.hd-mobile li a{display:flex;align-items:center;justify-content:space-between;padding-block:16px;font-family:var(--font-display);font-size:24px;color:var(--hd-navy-900);text-decoration:none}
.hd-mobile li a svg{width:20px;height:20px;color:var(--hd-brass-600)}
.hd-mobile .hd-primary{display:flex;justify-content:center;margin:24px auto 0;max-width:1240px;border-radius:9999px;padding:12px 24px;background:var(--hd-navy-900);color:var(--hd-white);font-weight:600;font-size:14px;text-decoration:none}
.site-header :focus-visible,.hd-mobile :focus-visible{outline-color:var(--hd-brass-500)}
.preview-note{display:flex;gap:var(--s3);align-items:flex-start;margin-top:var(--s6);padding:var(--s3) var(--s4);border:1px solid var(--border-accent);background:var(--badge-privileged-bg);font-size:13.5px;color:var(--text-primary);line-height:1.5}
.preview-note .badge{flex:none;color:var(--accent-gold-soft);border-color:var(--border-accent)}
.session{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);padding-top:var(--s6);font-size:13px;color:var(--text-secondary)}
.who{display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--text-secondary);min-width:0}
.who img{width:24px;height:24px;flex:none}
.sync{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.04em}

.page-head{display:flex;flex-wrap:wrap;gap:var(--s4) var(--s8);align-items:flex-end;justify-content:space-between;padding-block:var(--s4) var(--s6)}
.page-head h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,4.2vw,44px);line-height:1.12;letter-spacing:-.015em;margin-top:var(--s2)}
.switcher{display:grid;gap:6px;min-width:0;width:100%;max-width:460px}
.switcher label{font-size:12px;color:var(--text-secondary)}
.switch-row{display:flex;gap:var(--s2)}
.select-wrap{position:relative;flex:1;min-width:0}
.select-wrap select{appearance:none;width:100%;background:var(--bg-card);border:1px solid var(--border-subtle);padding:10px 40px 10px 12px;border-radius:0;font-family:var(--font-mono);font-size:13.5px;text-overflow:ellipsis}
.select-wrap select:hover{border-color:var(--border-accent)}
.select-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none;color:var(--text-secondary)}

.grid{display:grid;gap:var(--s6);padding-bottom:var(--s12)}
@media(min-width:1024px){.grid{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.col{display:grid;gap:var(--s6);min-width:0}
.panel{background:var(--bg-card);border:1px solid var(--border-subtle)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s4) var(--s6);border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:600}
.panel-b{padding:var(--s4) var(--s6)}

/* Dossier */
.dossier{box-shadow:var(--shadow-card)}
.dos-head{display:flex;gap:var(--s4);align-items:flex-start;justify-content:space-between;padding:var(--s6);border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.dos-id{display:flex;gap:var(--s4);align-items:flex-start;min-width:0}
.clip{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border-subtle);color:var(--text-secondary);background:var(--bg-subtle)}
.clip svg{width:18px;height:18px}
.dos-title{font-family:var(--font-display);font-size:clamp(22px,2.6vw,26px);font-weight:500;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.dos-title .mono{font-size:.78em;font-weight:500}
.dos-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:13px;color:var(--text-secondary);margin-top:var(--s2)}
.dos-badges{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.progress{padding:var(--s4) var(--s6) 0;display:flex;gap:var(--s3);align-items:center;font-size:13px;color:var(--text-secondary)}
.meter{flex:1;height:4px;background:var(--bg-subtle);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent-blue);transition:width .6s ease}

.stages{list-style:none;margin:0;padding:var(--s2) 0}
.stage{position:relative;padding:0 var(--s6)}
.stage + .stage::before{content:"";position:absolute;left:calc(var(--s6) + 15px);top:-12px;height:24px;width:1px;background:var(--border-subtle)}
.stage.done + .stage::before{background:var(--text-secondary)}
.stage-row{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--s4);align-items:center;padding-block:var(--s2)}
.stage-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:var(--s2) var(--s3);margin-left:calc(-1 * var(--s3));width:calc(100% + var(--s3));transition:border-color .15s,background .15s}
.stage-btn:hover{border-color:var(--border-accent);background:var(--bg-card-hover)}
.mark{width:32px;height:32px;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:600;position:relative;background:transparent;border:0;padding:0;color:inherit}
.mark svg{width:16px;height:16px}
button.mark{transition:box-shadow .15s}
button.mark:hover{box-shadow:0 0 0 1px var(--accent-gold)}
.st-complete .mark{background:var(--text-primary);color:var(--text-inverse)}
.st-in_progress .mark{border:1.5px solid var(--accent-blue);color:var(--accent-blue)}
.st-in_progress .mark::after{content:"";position:absolute;inset:-6px;border:1px solid var(--accent-blue);opacity:0;animation:pulse 2s ease-out infinite;pointer-events:none}
.st-in_progress .mark b{width:8px;height:8px;background:var(--accent-blue);display:block;animation:blink 1.4s ease-in-out infinite}
.st-pending .mark{border:1px dashed var(--text-muted);color:var(--text-muted)}
.editable .st-in_progress .mark b,.editable .st-pending .mark span{transition:opacity .15s}
.editable .stage:not(.st-complete) button.mark:hover b,.editable .stage:not(.st-complete) button.mark:hover span{opacity:0}
.editable .stage:not(.st-complete) button.mark:hover::before{content:"";position:absolute;width:10px;height:6px;border-left:2px solid var(--accent-gold);border-bottom:2px solid var(--accent-gold);transform:rotate(-45deg) translate(1px,-1px)}
@keyframes pulse{0%{opacity:.7;transform:scale(.85)}100%{opacity:0;transform:scale(1.25)}}
@keyframes blink{50%{opacity:.35}}
.stage-num{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--text-secondary)}
.stage-name{display:block;font-size:16px;font-weight:500;line-height:1.35}
.st-complete .stage-name{font-weight:600}
.st-pending .stage-name{color:var(--text-secondary)}
.st-pending .stage-num{color:var(--text-muted)}
.stage-sub{display:block;font-size:12.5px;color:var(--text-secondary);margin-top:2px}
.stat{font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.stat i{width:8px;height:8px;display:inline-block}
.st-complete .stat i{background:var(--text-primary)}
.st-in_progress .stat{color:var(--accent-blue)}
.st-in_progress .stat i{background:var(--accent-blue)}
.st-pending .stat{color:var(--text-muted)}
.st-pending .stat i{border:1px solid var(--text-muted)}
.inline-notes{margin:0 0 var(--s3) 48px;border-left:1px solid var(--accent-blue);padding-left:var(--s4)}
.inline-notes button{background:none;border:0;padding:2px 0;color:var(--accent-blue);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.inline-notes button svg{width:14px;height:14px;transition:transform .2s}
.inline-notes button[aria-expanded="true"] svg{transform:rotate(180deg)}
.inline-notes ul{list-style:none;margin:var(--s2) 0 0;padding:0;display:grid;gap:var(--s2);font-size:13.5px;color:var(--text-secondary)}
.inline-notes li .mono{color:var(--text-primary);font-size:12px;margin-right:var(--s2)}
.hint{padding:0 var(--s6) var(--s3);font-size:12.5px;color:var(--text-muted)}

.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border-subtle);background:var(--bg-subtle);margin:0}
.metric{padding:var(--s4) var(--s3);text-align:center;min-width:0}
.metric + .metric{border-left:1px solid var(--border-subtle)}
.metric dt{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary)}
.metric dd{margin:6px 0 0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:clamp(15px,2.2vw,20px);font-weight:600;overflow-wrap:anywhere}
.metric dd.word{font-family:var(--font-sans);font-size:clamp(14px,1.9vw,17px)}
.metric input,.metric select{width:100%;max-width:170px;margin:6px auto 0;display:block;text-align:center;background:var(--bg-primary);border:1px solid var(--border-subtle);padding:6px;font-family:var(--font-mono);border-radius:0}
.dos-foot{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;padding:var(--s4) var(--s6);border-top:1px solid var(--border-subtle)}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap}

.activity{list-style:none;margin:0;padding:0}
.activity li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
.activity li:last-child{border-bottom:0}
.activity .mono{font-size:12px;color:var(--text-secondary);padding-top:2px}
.activity small{display:block;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;margin-top:2px}

/* Docs */
.docs{list-style:none;margin:0;padding:0}
.doc{display:grid;grid-template-columns:36px minmax(0,1fr);gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border-subtle)}
.doc:last-child{border-bottom:0}
.doc-ic{width:36px;height:42px;border:1px solid var(--border-subtle);display:grid;place-items:end center;padding-bottom:5px;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--text-secondary);background:var(--bg-subtle);position:relative;overflow:hidden}
.doc-ic::before{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;background:var(--bg-card);border-left:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.doc-name{display:block;font-size:14px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.doc-meta{display:block;font-size:12px;color:var(--text-secondary)}
.doc.locked .doc-name{color:var(--text-secondary)}
.lock-note{display:inline-flex;gap:5px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.04em}
.lock-note svg{width:12px;height:12px}
.doc-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);transition:border-color .15s,color .15s;flex:none}
.icon-btn:hover:not([disabled]){border-color:var(--border-accent);color:var(--text-primary)}
.icon-btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn svg{width:16px;height:16px}
.empty-docs{padding:var(--s4) 0;color:var(--text-secondary);font-size:14px}

.inv{display:flex;gap:var(--s4);align-items:center}
.mono-av{width:48px;height:48px;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;font-weight:600;background:var(--bg-subtle);border:1px solid var(--border-subtle)}
.inv-name{font-weight:600;font-size:16px}
.contact{margin-top:var(--s4);display:grid;gap:var(--s2)}
.contact-row{display:flex;align-items:center;gap:var(--s2);justify-content:space-between;background:var(--bg-secondary);border:1px solid var(--border-subtle);padding:8px 8px 8px 12px}
.contact-row span{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere;user-select:all;min-width:0}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.6);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg-card);border-left:1px solid var(--border-subtle);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dr-head{padding:var(--s6);border-bottom:1px solid var(--border-subtle);display:flex;justify-content:space-between;gap:var(--s4);align-items:flex-start}
.dr-head h2{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.15;margin-top:6px}
.dr-body{padding:var(--s6);overflow:auto;display:grid;gap:var(--s6);align-content:start}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--border-subtle);margin:0}
.kv div{padding:var(--s3) var(--s4);background:var(--bg-subtle)}
.kv div + div{border-left:1px solid var(--border-subtle)}
.kv dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary)}
.kv dd{margin:4px 0 0;font-family:var(--font-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.notes li{border-left:1px solid var(--accent-gold);padding-left:var(--s4);font-size:14.5px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:start}
.notes .mono{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:2px}
.admin-box{border:1px solid var(--accent-indigo);padding:var(--s4);display:grid;gap:var(--s3)}
.admin-box > .eyebrow{color:var(--accent-indigo)}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:var(--s4);overflow:auto}
.modal-card{width:100%;max-width:560px;background:var(--bg-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-card);margin:auto}
.modal-card h2{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.2;margin-top:6px}
.modal-h{padding:var(--s6) var(--s6) var(--s4);display:flex;justify-content:space-between;gap:var(--s4);align-items:flex-start;border-bottom:1px solid var(--border-subtle)}
.modal-b{padding:var(--s6);display:grid;gap:var(--s4)}
.modal-f{padding:var(--s4) var(--s6);border-top:1px solid var(--border-subtle);display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;align-items:center}

.form-grid{display:grid;gap:var(--s3) var(--s4);grid-template-columns:1fr}
@media(min-width:520px){.form-grid.two{grid-template-columns:1fr 1fr}}
.f{display:grid;gap:5px;min-width:0}
.f > span{font-size:12.5px;color:var(--text-secondary);font-weight:500}
.f input,.f select,.f textarea{width:100%;background:var(--bg-primary);border:1px solid var(--border-subtle);padding:9px 10px;border-radius:0;min-width:0}
.f input:hover,.f select:hover,.f textarea:hover{border-color:var(--border-accent)}
.f input[readonly]{color:var(--text-secondary)}
.f.full{grid-column:1/-1}
fieldset.group{border:0;padding:0;margin:0;display:grid;gap:var(--s3)}
fieldset.group legend{padding:0;margin-bottom:var(--s3)}
.err{color:var(--danger);font-size:13px;min-height:0}
.err:empty{display:none}
.drop{border:1px dashed var(--border-subtle);padding:var(--s6);text-align:center;background:var(--bg-secondary);transition:border-color .15s}
.drop.over{border-color:var(--accent-gold)}
.drop strong{display:block;font-weight:500;margin-bottom:4px;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(var(--s6) + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--bg-subtle);border:1px solid var(--border-accent);padding:10px 16px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);box-shadow:var(--shadow-card);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.state{min-height:70vh;display:grid;place-items:center;text-align:center}
.state .panel{padding:var(--s12) var(--s8);max-width:520px}
.state h1{font-family:var(--font-display);font-size:32px;font-weight:600;margin:var(--s3) 0 var(--s2)}
.foot{border-top:1px solid var(--border-subtle);padding-block:var(--s6) var(--s8);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s6);justify-content:space-between;font-size:12.5px;color:var(--text-muted)}

@media(max-width:560px){
  .stage-btn{grid-template-columns:minmax(0,1fr)}
  .stat{justify-content:flex-start}
  .metric dt{font-size:9.5px;letter-spacing:.06em}
  .activity li{grid-template-columns:1fr;gap:2px}
  .dos-head,.panel-h,.panel-b,.dos-foot,.progress,.hint{padding-inline:var(--s4)}
  .stage{padding-inline:var(--s4)}
  .stage + .stage::before{left:calc(var(--s4) + 15px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2,"0");
function fmtDate(d){ if(!d) return "—"; const p=String(d).slice(0,10).split("-"); if(p.length<3) return "—"; return `${MON[+p[1]-1]} ${+p[2]}, ${p[0]}`; }
function fmtStamp(d){ if(!d) return "—"; const t=String(d).length>10?String(d).slice(11,16):""; return fmtDate(d)+(t?` · ${t}`:""); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowLocal(){ const d=new Date(); return `${today()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtBytes(n){ if(!n) return ""; if(n<1024) return n+" B"; if(n<1048576) return Math.round(n/1024)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function uid(p){ return p+Math.random().toString(36).slice(2,9); }
const nf = new Intl.NumberFormat("en-US");
const cur = () => S.matters.find(c=>c._id===S.caseId);
function recompute(c){ const s=(c.stages||[]).find(x=>x.status!=="complete"); c.currentStageId = s? s.id : null; }
function stageDone(c,id){ const s=c.stages.find(x=>x.id===id); return !!(s && s.status==="complete"); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),3400); }
function byTag(id){ return id?`<span data-uid="${esc(id)}">a team member</span>`:`<span>Stallard Panebianco</span>`; }

const writeQueue = {};
function save(m){
  const id=m._id; const body=JSON.parse(JSON.stringify(m)); delete body._id;
  body.updatedAt=new Date().toISOString(); body.updatedBy=S.me&&S.me.id||null;
  S.pending++; renderSync();
  const p=(writeQueue[id]||Promise.resolve()).then(()=>S.db.doc("matters/"+id).set(body));
  writeQueue[id]=p.catch(()=>{});
  return p.then(()=>{S.pending--;renderSync();}).catch(e=>{S.pending--;renderSync();handleWriteError(e);throw e;});
}
function handleWriteError(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){ S.canEdit=false; render(); toast("Your access is view-only, so changes can't be saved."); }
  else if(code==="quota_exceeded") toast("The portal's storage is full. Delete unused matters or documents, then try again.");
  else if(code==="resource_exhausted") toast("Too many changes at once. Wait a moment, then try again.");
  else toast("That change didn't save. Check your connection and try again.");
}
/* Apply a change to the current matter, log it, render and save. */
function mutate(fn, logText, id){
  const src = id? S.matters.find(x=>x._id===id) : cur(); if(!src) return Promise.resolve();
  const m = JSON.parse(JSON.stringify(src)); fn(m); recompute(m);
  if(logText){ m.activity=[{at:new Date().toISOString(),text:logText,by:S.me&&S.me.id||null},...(m.activity||[])].slice(0,80); }
  S.matters = S.matters.map(x=>x._id===m._id?m:x);
  render(); if(!$("#drawer").hidden && !S.drawerDirty) renderDrawer();
  return save(m).catch(()=>{});
}

async function waitForClaude(ms){
  const t0=Date.now();
  while(!(window.claude&&window.claude.use)){ if(Date.now()-t0>ms) return false; await new Promise(r=>setTimeout(r,100)); }
  return true;
}
(async function boot(){
  if(!(await waitForClaude(4000))){ enterPreview("outside"); return; }
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db){ enterPreview("signedout"); return; }
    S.db=db; S.user=user;
    if(user){ const [ce,me]=await Promise.all([user.canEdit(),user.me()]); S.canEdit=!!ce; S.me=me; }
    if(S.canEdit){ claude.use("assets").then(a=>{S.assets=a;if(!S.loading&&!S.editMetrics) render();}).catch(()=>{}); }
    db.collection("matters").onSnapshot(snap=>{
      S.matters = snap.docs.map(d=>Object.assign(JSON.parse(JSON.stringify(d.data()||{})),{_id:d.id}))
        .sort((a,b)=> (a.currentStageId?0:1)-(b.currentStageId?0:1) || String(b.openedAt||"").localeCompare(String(a.openedAt||"")));
      S.matters.forEach(recompute);
      if(!S.matters.find(x=>x._id===S.caseId)) S.caseId = S.matters[0]? S.matters[0]._id : null;
      S.loading=false; if(!S.editMetrics) render();
      if(!$("#drawer").hidden){ if(!cur()||!cur().stages.find(s=>s.id===S.drawerStage)) closeDrawer(); else if(!S.drawerDirty) renderDrawer(); }
    }, err=>{ S.loading=false; S.error = err&&err.code==="revoked" ? "revoked" : "error"; render(); });
  }catch(e){ enterPreview("signedout"); }
})();

function toLocalStamp(iso){ const d=new Date(iso); if(isNaN(d)) return null; return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function docRow(c,d){
  const E=S.canEdit; const st=c.stages.find(s=>s.id===d.unlockStage)||c.stages[c.stages.length-1];
  const open=stageDone(c,d.unlockStage); const has=!!d.assetId;

  else meta=`<span class="doc-meta">${esc(d.format)}${d.sizeBytes?` · ${fmtBytes(d.sizeBytes)}`:""} · Released ${fmtDate(st.completedAt)}</span>`;
  if(E && open && has) meta=`<span class="doc-meta">${esc(d.format)}${d.sizeBytes?` · ${fmtBytes(d.sizeBytes)}`:""} · Visible to client</span>`;
  return `<li class="doc ${open&&has?"":"locked"}"><span class="doc-ic">${esc((d.format||"FILE").slice(0,4))}</span>

        ${E?`<button class="btn btn-sm btn-edit" data-editdoc="${d.id}">${I.edit}${has?"Edit":"Edit / attach file"}</button>`:""}
      </div>

}

/* ---------- bindings ---------- */
function bind(){
  const on=(sel,fn)=>{const el=$(sel); if(el) el.onclick=fn;};
  const c=cur();
  on("#newMatter",()=>openMatterForm(null));
  if(!c) return;
  $("#matter").onchange=e=>{S.caseId=e.target.value;S.editMetrics=false;try{localStorage.setItem("sp-matter",S.caseId);}catch(err){}render();};
  on("#editMatter",()=>openMatterForm(c));
  on("#addDoc",()=>openDocForm(null));
  on("#brief",downloadBrief);
  on("#editMetrics",()=>{S.editMetrics=true;render();$("#mInt").focus();});
  on("#cancelMetrics",()=>{S.editMetrics=false;render();});
  on("#saveMetrics",()=>{
    const i=Number($("#mInt").value), r=Number($("#mRec").value), std=$("#mStd").value;
    if(!Number.isInteger(i)||i<0||!Number.isInteger(r)||r<0){toast("Counts must be whole numbers of zero or more.");return;}
    S.editMetrics=false;
    const was=c.metrics;
    const changes=[]; if(was.interviewsCount!==i) changes.push(`interviews ${i}`); if(was.recordsReviewedCount!==r) changes.push(`records reviewed ${nf.format(r)}`); if(was.standardOfProof!==std) changes.push(`standard ${std}`);
    if(!changes.length){render();return;}
    mutate(m=>{m.metrics={interviewsCount:i,recordsReviewedCount:r,standardOfProof:std};},"Metrics updated: "+changes.join(", ")+".").then(()=>toast("Metrics saved."));
  });
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleStage(b.dataset.toggle));
  document.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>openDrawer(b.dataset.stage,b));
  document.querySelectorAll("[data-inline]").forEach(b=>b.onclick=()=>{const k=c._id+b.dataset.inline;S.openInline[k]=!S.openInline[k];render();});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy,b));
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>downloadDoc(b.dataset.dl,b));
  document.querySelectorAll("[data-editdoc]").forEach(b=>b.onclick=()=>openDocForm(b.dataset.editdoc));
}

/* ---------- stages ---------- */
function toggleStage(id){
  const c=cur(); const s=c.stages.find(x=>x.id===id); if(!s) return;
  const completing = s.status!=="complete";
  mutate(m=>{
    const t=m.stages.find(x=>x.id===id); const idx=m.stages.indexOf(t);
    if(completing){
      t.status="complete"; t.completedAt=nowLocal(); t.startedAt=t.startedAt||today(); t.estimatedCompletion=t.estimatedCompletion||null;
      const next=m.stages.slice(idx+1).find(x=>x.status!=="complete");
      if(next && next.status==="pending" && !m.stages.some(x=>x.status==="in_progress")){ next.status="in_progress"; next.startedAt=next.startedAt||today(); }
    }else{
      t.status="in_progress"; t.completedAt=null;
      m.stages.slice(idx+1).forEach(x=>{ if(x.status==="in_progress"){ x.status="pending"; } });
    }
  }, `Stage ${pad(s.number)} · ${s.name} ${completing?"marked complete":"reopened"}.`)
  .then(()=>{});
  toast(completing?`Stage ${pad(s.number)} marked complete.`:`Stage ${pad(s.number)} reopened.`);
}

      <label class="drop" id="drop" for="dFile">
        <strong id="dropName">${d&&d.assetId?`Current file: ${esc(d.format)}${d.sizeBytes?` · ${fmtBytes(d.sizeBytes)}`:""}`:"Choose a file or drop it here"}</strong>
        <span class="fine">${d&&d.assetId?"Choose a new file to replace it. ":""}PDF, images, text, CSV, Markdown, JSON or video. Up to 20 MB.</span>
        <input id="dFile" type="file" accept="${ACCEPT}" style="position:absolute;width:1px;height:1px;opacity:0">
      </label>
      <div class="form-grid two">
        <label class="f full"><span>Document name shown to the client</span><input id="dName" maxlength="100" value="${esc(d?d.name:"")}" placeholder="Final Executive Summary"></label>
        <label class="f full"><span>Release to the client when</span><select id="dStage">${c.stages.map(s=>`<option value="${s.id}" ${(d?d.unlockStage:c.currentStageId||s.id)===s.id?"selected":""}>Stage ${pad(s.number)} · ${esc(s.name)} is complete${s.status==="complete"?" (released now)":""}</option>`).join("")}</select></label>
      </div>
      <div class="err" id="dErr" role="alert"></div>
      ${isNew?"":`<div id="dDelZone"></div>`}
    </div>
    <div class="modal-f">
      ${isNew?"<span></span>":`<button type="button" class="btn btn-danger" id="dDel">${I.trash}Remove document</button>`}
      <div class="btn-row"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn btn-edit" id="dSave">${isNew?"Upload and add":"Save"}</button></div>
    </div></form>`, m=>{
    m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
    const pick=f=>{ if(!f) return; const ext=(f.name.split(".").pop()||"").toLowerCase();
      if(!UPLOAD_TYPES[ext]){ $("#dErr").textContent="That file type isn't supported. Save Word or Excel files as PDF first."; return; }
      if(f.size>20*1048576){ $("#dErr").textContent="That file is over 20 MB. Compress it or split it, then try again."; return; }
      file=f; $("#dErr").textContent=""; $("#dropName").textContent=`${f.name} · ${fmtBytes(f.size)}`;
      if(!$("#dName").value.trim()) $("#dName").value=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");
    };
    $("#dFile").onchange=e=>pick(e.target.files[0]);
    const dz=$("#drop");
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");pick(e.dataTransfer.files[0]);});
    $("#dForm").onsubmit=async e=>{e.preventDefault();
      const name=$("#dName").value.trim(), stage=$("#dStage").value;
      if(!name){$("#dErr").textContent="Name the document.";return;}
      if(isNew&&!file){$("#dErr").textContent="Choose a file to upload.";return;}
      let up=null;
      if(file){
        if(!S.assets){$("#dErr").textContent="Uploads aren't available in this view.";return;}
        const btn=$("#dSave"); btn.disabled=true; btn.textContent="Uploading…";
        const ext=file.name.split(".").pop().toLowerCase();
        try{ up=await S.assets.upload(file,{type:UPLOAD_TYPES[ext]}); }
        catch(err){ btn.disabled=false; btn.textContent=isNew?"Upload and add":"Save";
          const code=err&&err.code;
          $("#dErr").textContent = code==="too_large"?"That file is over the size limit. Compress it and try again."
            : code==="unsupported_type"?"That file type isn't supported. Save it as PDF and try again."
            : code==="quota_or_state"?"Document storage is full. Remove unused documents, then try again."
            : code==="rate_limited"?"Too many uploads at once. Wait a moment and try again."
            : "The upload didn't finish. Try again."; return; }
      }
      const oldAsset = d&&d.assetId;
      const stObj=c.stages.find(s=>s.id===stage);
      closeModal();
      const ext=file?file.name.split(".").pop().toUpperCase():null;
      await mutate(m=>{
        if(isNew){ m.documents.push({id:uid("d"),name,format:ext==="JPEG"?"JPG":ext,sizeBytes:up.sizeBytes,assetId:up.id,unlockStage:stage,addedAt:new Date().toISOString(),by:S.me&&S.me.id||null}); }
        else{ const t=m.documents.find(x=>x.id===d.id); t.name=name; t.unlockStage=stage; if(up){t.assetId=up.id;t.sizeBytes=up.sizeBytes;t.format=ext==="JPEG"?"JPG":ext;} }
      }, isNew?`Document added: ${name} (releases after Stage ${pad(stObj.number)}).`: up?`Document file replaced: ${name}.`:`Document updated: ${name}.`);
      if(up&&oldAsset&&S.assets){ try{ await S.assets.delete(oldAsset); }catch(x){} }
      toast(isNew?"Document added.":"Document saved.");
    };
    if(!isNew){
      $("#dDel").onclick=()=>{
        $("#dDelZone").innerHTML=`<div class="admin-box" style="border-color:var(--danger-border)"><p class="muted" style="margin:0;font-size:14px">Remove “${esc(d.name)}”${d.assetId?" and delete its file":""} for everyone? This can't be undone.</p>
          <div class="btn-row"><button type="button" class="btn btn-danger" id="dDelGo">${I.trash}Remove permanently</button></div></div>`;
        $("#dDelGo").focus();
        $("#dDelGo").onclick=async()=>{ closeModal();
          await mutate(m=>{m.documents=m.documents.filter(x=>x.id!==d.id);},`Document removed: ${d.name}.`);
          if(d.assetId&&S.assets){ try{ await S.assets.delete(d.assetId); }catch(x){} }
          toast("Document removed."); };
      };
    }
  });
}

/* ---------- keyboard: escape + focus trap ---------- */
$("#scrim").onclick=()=>{ if(!$("#modal").hidden) closeModal(); else closeDrawer(); };
document.addEventListener("keydown",e=>{
  const layer = !$("#modal").hidden ? $("#modal") : (!$("#drawer").hidden ? $("#drawer") : null);
  if(!layer) return;
  if(e.key==="Escape"){ if(layer.id==="modal") closeModal(); else closeDrawer(); return; }
  if(e.key==="Tab"){ const f=[...layer.querySelectorAll("button,select,input,textarea,a[href],label.drop")].filter(x=>!x.disabled&&x.offsetParent!==null&&!(x.type==="file")); if(!f.length) return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();} }
});

async function copy(text,btn){
  try{ await navigator.clipboard.writeText(text); toast("Copied."); }
  catch(e){ const span=btn.previousElementSibling; const r=document.createRange(); r.selectNodeContents(span); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected. Press Ctrl+C or ⌘C to copy."); }
}

/* ---------- downloads ---------- */
let downloadsP=null;
function getDownloads(){
  if(!(window.claude&&window.claude.use)) return Promise.resolve(null);
  if(!downloadsP) downloadsP=window.claude.use("downloads").catch(()=>null);
  return downloadsP;
}
async function saveFile(filename,data){
  const dl=await getDownloads();
  if(!dl && S.preview==="outside"){
    /* Outside claude.ai there is no sandbox, so an ordinary browser download works. */
    const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Download started."); return true;
  }
  if(!dl){ toast("Downloads aren't available in this view. Use View to open the file instead."); return false; }
  try{ await dl.save({filename,data}); toast("Saved."); return true; }
  catch(e){ const code=e&&e.code;
    toast(code==="declined"?"Download cancelled.":code==="rate_limited"?"A save prompt is already open. Finish it, then try again.":code==="rejected_extension"?"This file type can't be downloaded here. Use View instead.":"The file couldn't be saved here. Try View instead.");
    return false; }
}
async function downloadDoc(id,btn){
  const c=cur(); const d=c.documents.find(x=>x.id===id); if(!d||!d.assetId) return;
  btn.disabled=true;
  try{ const r=await fetch("/_blob/"+d.assetId); if(!r.ok) throw new Error("missing"); const blob=await r.blob();
    const ext=(d.format||"pdf").toLowerCase(); const safe=d.name.replace(/[^\w .()-]+/g,"").trim()||"document";
    await saveFile(`${c.caseId} - ${safe}.${ext==="jpg"?"jpg":ext}`,blob); }
  catch(e){ toast("This file is no longer available. Ask your investigator to re-upload it."); }
  finally{ btn.disabled=false; }
}

function buildBrief(c){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt",format:"letter"});
  const W=612, M=56; let y=64;
  const ink=[16,24,40], mid=[96,106,124], gold=[150,116,52];
  const T=s=>String(s??"").replace(/[^\x20-\x7E -ÿ]/g,"-");
  try{ doc.addImage(LOGO_PRINT,"PNG",M,y-17,24,24.4); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...ink); doc.text("Stallard Panebianco", M+32, y);
  doc.setFont("helvetica","normal"); doc.setTextColor(...mid); doc.text("Workplace Investigations", M+144, y);
  doc.setFont("helvetica","bold"); doc.setTextColor(...gold); doc.text(c.isPrivileged?"PRIVILEGED & CONFIDENTIAL":"CONFIDENTIAL", W-M, y, {align:"right"});
  y+=12; doc.setDrawColor(200,200,205); doc.line(M,y,W-M,y);
  y+=36; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...mid); doc.text("STATUS BRIEF", M, y);
  y+=24; doc.setFont("times","bold"); doc.setFontSize(22); doc.setTextColor(...ink);
  const tl=doc.splitTextToSize(T(`Matter ${c.caseId} - ${c.matterType}`), W-M*2); doc.text(tl, M, y); y+=(tl.length-1)*24;
  y+=18; doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...mid);
  const g=new Date(); doc.text(T(`Opened ${fmtDate(c.openedAt)}   |   Generated ${MON[g.getMonth()]} ${g.getDate()}, ${g.getFullYear()} ${pad(g.getHours())}:${pad(g.getMinutes())}   |   Lead investigator ${(c.investigator||{}).name||"-"}`), M, y);
  y+=40; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...mid); doc.text("INVESTIGATION STAGES", M, y); y+=10;
  c.stages.forEach(s=>{
    y+=8; doc.setDrawColor(225,225,230); doc.line(M,y,W-M,y); y+=20;
    if(s.status==="complete"){doc.setFillColor(...ink);doc.rect(M,y-10,10,10,"F");}
    else if(s.status==="in_progress"){doc.setDrawColor(70,120,180);doc.setLineWidth(1.5);doc.rect(M,y-10,10,10);doc.setLineWidth(.5);}
    else {doc.setDrawColor(170,170,180);doc.rect(M,y-10,10,10);}
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...mid); doc.text(`STAGE ${pad(s.number)}`, M+22, y-2);
    doc.setFontSize(12); doc.setTextColor(...ink); doc.text(T(s.name), M+82, y-2);
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    const right=s.status==="complete"?`Complete - ${fmtDate(s.completedAt)}`:s.status==="in_progress"?`In progress - est. ${fmtDate(s.estimatedCompletion)}`:`Upcoming${s.estimatedCompletion?` - target ${fmtDate(s.estimatedCompletion)}`:""}`;
    doc.text(T(right), W-M, y-2, {align:"right"});
    const last=(s.notes||[])[s.notes.length-1];
    if(last){ y+=15; doc.setTextColor(...mid); doc.setFontSize(9.5); const lines=doc.splitTextToSize(T(`${fmtDate(last.date)} - ${last.text}`), W-M*2-82); doc.text(lines, M+82, y-2); y+=(lines.length-1)*12; }
  });
  y+=34; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...mid); doc.text("CASE METRICS", M, y);
  y+=12; const cw=(W-M*2)/3; doc.setFillColor(244,244,247); doc.rect(M,y,W-M*2,58,"F");
  [["INTERVIEWS",nf.format(c.metrics.interviewsCount||0)],["RECORDS REVIEWED",nf.format(c.metrics.recordsReviewedCount||0)],["STANDARD OF PROOF",c.metrics.standardOfProof]].forEach(([k,v],i)=>{
    const cx=M+cw*i+cw/2; doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...mid); doc.text(k,cx,y+20,{align:"center"});
    doc.setFontSize(15); doc.setTextColor(...ink); doc.text(T(v),cx,y+42,{align:"center"});
    if(i){doc.setDrawColor(215,215,222);doc.line(M+cw*i,y+10,M+cw*i,y+48);} });
  y+=86; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...mid); doc.text("DELIVERABLES", M, y); y+=16;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  if(!c.documents.length){ doc.setTextColor(...mid); doc.text("None listed.", M, y); }
  c.documents.forEach(d=>{ if(y>720) return; const ok=stageDone(c,d.unlockStage); const st=c.stages.find(s=>s.id===d.unlockStage)||{number:0};
    doc.setTextColor(...ink); doc.text(T(d.name).slice(0,60), M, y); doc.setTextColor(...mid);
    doc.text(ok&&d.assetId?`Released ${fmtDate(st.completedAt)}`:ok?"In preparation":`Locked until Stage ${pad(st.number)} complete`, W-M, y, {align:"right"}); y+=16; });
  doc.setDrawColor(200,200,205); doc.line(M,742,W-M,742); doc.setFontSize(8.5); doc.setTextColor(...mid);
  doc.text("Contains no findings or witness identities. Distribute only to individuals within the privilege.", M, 756);
  return doc.output("blob");
}
async function downloadBrief(){
  const btn=$("#brief"); const c=cur();
  if(!window.jspdf){toast("The PDF engine didn't load. Reload the page and try again.");return;}
  btn.disabled=true;
  try{ const d=new Date(); await saveFile(`${c.caseId}_Status-Brief_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.pdf`, buildBrief(c)); }
  finally{ btn.disabled=false; }
}

render();
